<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Your result</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/kw.css?v=20261120x">
<link rel="preload" href="fonts/outfit/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<!-- arriving from the learning path: keep the black cover up until the page can lift it -->
<script>try { if (sessionStorage.getItem('kw-launch')) document.documentElement.classList.add('kw-arriving'); } catch (e) {}</script>
<style>html.kw-arriving #launch[hidden]{display:grid !important}</style>
<script src="lib/gsap.min.js"></script>
<script src="js/motion.js" defer></script>
</head>
<body data-kind="speak" data-view="result">
<header class="topbar" id="topbar">
  <nav class="nav" aria-label="Main">
    <a href="index.html#path" aria-current="page" title="Back to your learning path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.8"/></svg><span class="lbl" id="nav-lbl">Segment 1</span></a>
  </nav>
</header>

<div class="panel">
  <div class="pagehead">
    <div><p class="crumb">Communication Skills · Segment 1</p><h1 id="page-title">Your result</h1></div>
  </div>

  <main id="main">
    <!-- Segment 1 analysis: the score, what to practise, and the five skills (first tries only) -->
    <section class="screen" data-screen="result" hidden>
      <div class="work res-work">
        <div class="res-grid">
          <section class="card res-score" id="res-score" aria-labelledby="res-score-t"></section>
          <section class="card res-practise" id="res-practise" aria-labelledby="res-pr-t"></section>
          <section class="card res-skills" id="res-skills" aria-labelledby="res-sk-t"></section>
        </div>
      </div>
      <div class="actionbar"><div class="actionbar-in">
        <button type="button" class="btn secondary back-btn" data-go="path" aria-label="Back to your learning path"><i data-ui="back"></i><span class="back-lb">Back</span></button>
        <button type="button" class="btn primary retake-btn" id="retake">Retake</button>
      </div></div>
    </section>
  </main>
</div>

<div class="modal" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="cf-title">
  <div class="modal-card">
    <h2 id="cf-title">Retake Segment 1?</h2>
    <p>This clears all your progress and answers, and starts again from the Key Words start screen.</p>
    <div class="cf-actions"><button type="button" class="btn secondary" id="cf-cancel">Cancel</button><button type="button" class="btn primary" id="cf-go">Retake</button></div>
  </div>
</div>

<div class="launch" id="launch" hidden aria-hidden="true">
  <div class="launch-in">
    <p class="launch-part" id="launch-part">Part 1 of 5</p>
    <p class="launch-title" id="launch-title">Greetings</p>
    <div class="launch-dots" id="launch-dots"></div>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div class="modal-icon" id="modal-icon"></div>
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <button type="button" class="btn primary" id="modal-btn"></button>
  </div>
</div>

<div id="live" class="sr-only" aria-live="polite"></div>

<section class="fb qsheet" id="qsheet" hidden aria-live="polite">
  <div class="fb-sheet">
    <div class="fb-in">
      <span class="fb-badge" id="qs-badge" aria-hidden="true"></span>
      <div class="fb-text">
        <div class="fb-head"><h2 class="fb-title" id="qs-title"></h2></div>
        <p id="qs-text"></p>
        <p class="fb-note" id="qs-note"></p>
      </div>
      <button type="button" class="btn go fb-next" id="qs-next">Continue</button>
    </div>
  </div>
</section>

<div class="textdrawer" id="textdrawer" hidden role="dialog" aria-modal="true" aria-labelledby="td-title">
  <div class="td-panel">
    <div class="td-head"><b id="td-title">The passage</b><button type="button" class="btn secondary" id="td-close">Close</button></div>
    <div class="td-body"></div>
  </div>
</div>

<script src="js/kw-core.js?v=20261120r"></script>
<script src="js/result.js?v=20261120b"></script>
<script src="dev-menu/dev-menu.js?v=2"></script> <!-- DEV MENU: testing only. Delete this line and the dev-menu folder when done. -->
</body>
</html>
